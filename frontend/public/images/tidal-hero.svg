<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1b30"/>
      <stop offset="1" stop-color="#0f2d4a"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- quiet wave band across the base -->
  <g fill="none" stroke="#22b8cf" stroke-linecap="round" stroke-width="3">
    <path d="M0 790 C 200 740, 400 840, 640 790 S 1080 740, 1320 790 S 1520 830, 1600 800" opacity="0.55"/>
    <path d="M0 850 C 220 800, 430 900, 680 850 S 1100 800, 1340 850 S 1530 880, 1600 862" opacity="0.3"/>
  </g>

  <!-- ledger page -->
  <g transform="translate(560 170)" filter="url(#shadow)">
    <rect width="480" height="620" rx="18" fill="url(#sheet)"/>
    <rect x="0" y="0" width="480" height="92" rx="18" fill="#0f2d4a"/>
    <rect x="0" y="60" width="480" height="32" fill="#0f2d4a"/>
    <text x="40" y="60" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Invoice INV-0001</text>
    <text x="40" y="135" fill="#3f5870" font-family="Helvetica, Arial, sans-serif" font-size="18">Bill to</text>
    <rect x="40" y="152" width="200" height="14" rx="7" fill="#0b7f96" opacity="0.35"/>
    <rect x="40" y="176" width="140" height="14" rx="7" fill="#0b7f96" opacity="0.2"/>
    <g stroke="#d6e4ea" stroke-width="2">
      <path d="M40 240 H440"/><path d="M40 300 H440"/><path d="M40 360 H440"/><path d="M40 420 H440"/>
    </g>
    <rect x="40" y="262" width="230" height="14" rx="7" fill="#0a1b30" opacity="0.5"/>
    <rect x="40" y="322" width="180" height="14" rx="7" fill="#0a1b30" opacity="0.5"/>
    <rect x="40" y="382" width="260" height="14" rx="7" fill="#0a1b30" opacity="0.5"/>
    <path d="M40 470 H440" stroke="#0a1b30" stroke-width="2"/>
    <text x="40" y="530" fill="#3f5870" font-family="Helvetica, Arial, sans-serif" font-size="18">Balance due</text>
    <text x="440" y="560" text-anchor="end" fill="#0a1b30" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700">$ 0.00</text>
  </g>
</svg>
